on: [pull_request]
name: Build PR preview

jobs:
  build-pr-preview:
    name: Build and publish PR Preview
    uses: quiltmc/quiltmc.org/.github/workflows/build-pr-preview.yaml@actions-upgrade
    with:
      pr-number: ${{ github.event.number }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      deployments: write