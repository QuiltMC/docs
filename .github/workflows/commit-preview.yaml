on: [push]
name: Commit preview

jobs:
  build-and-publish:
    name: Build and publish to Cloudflare
    uses: quiltmc/quiltmc.org/.github/workflows/commit-preview.yaml@main
    with:
      preview-domain: docs.quiltmc.workers.dev
    secrets: inherit
    permissions:
      contents: write
      actions: read
      deployments: write